<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 874.903 467.6" width="874.903" height="467.6" style="--bg:#FFFFFF;--fg:#27272A">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM%20Plex%20Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'IBM Plex Mono', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="mono" data-label="Monolithic kernel">
  <rect x="40" y="40" width="395.524" height="327.6" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="395.524" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Monolithic kernel</text>
<g class="subgraph" data-id="mu" data-label="user mode">
  <rect x="56" y="84" width="124.338" height="153.8" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="56" y="84" width="124.338" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="68" y="98" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">user mode</text>
</g>
<g class="subgraph" data-id="mk" data-label="kernel mode: one address space, all within the bug's reach">
  <rect x="200.338" y="84" width="219.186" height="267.6" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="200.338" y="84" width="219.186" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="212.338" y="98" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">kernel mode: one address space, all within the bug&#39;s reach</text>
</g>
</g>
<g class="subgraph" data-id="micro" data-label="Microkernel">
  <rect x="455.524" y="40" width="379.37899999999996" height="387.6" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="455.524" y="40" width="379.37899999999996" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="467.524" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Microkernel</text>
<g class="subgraph" data-id="uu" data-label="user mode: one address space per box">
  <rect x="471.524" y="200.9" width="347.37899999999996" height="210.70000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="471.524" y="200.9" width="347.37899999999996" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="483.524" y="214.9" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">user mode: one address space per box</text>
</g>
<g class="subgraph" data-id="kk" data-label="kernel mode">
  <rect x="471.524" y="84" width="271.7969999999999" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="471.524" y="84" width="271.7969999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="483.524" y="98" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">kernel mode</text>
</g>
</g>
<g class="node" data-id="p1" data-label="program" data-shape="rectangle">
  <rect x="72" y="128" width="92.338" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="118.169" y="146.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">program</text>
</g>
<g class="node" data-id="p2" data-label="program" data-shape="rectangle">
  <rect x="72" y="184.9" width="92.338" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="118.169" y="203.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">program</text>
</g>
<g class="node" data-id="fs1" data-label="file system" data-shape="rectangle">
  <rect x="216.338" y="128" width="101.971" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="267.32349999999997" y="146.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">file system</text>
</g>
<g class="node" data-id="net1" data-label="network stack" data-shape="rectangle">
  <rect x="216.338" y="184.9" width="124.20099999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="278.4385" y="203.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">network stack</text>
</g>
<g class="node" data-id="drv1" data-label="network driver with a bug" data-shape="rectangle">
  <rect x="216.338" y="300.25" width="187.186" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="#c00" stroke-width="3px" />
  <text x="309.931" y="318.7" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">network driver with a bug</text>
</g>
<g class="node" data-id="sch1" data-label="scheduler and memory" data-shape="rectangle">
  <rect x="216.338" y="243.35000000000002" width="175.33" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="304.003" y="261.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">scheduler and memory</text>
</g>
<g class="node" data-id="p3" data-label="program" data-shape="rectangle">
  <rect x="487.524" y="243.35000000000002" width="92.338" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="533.693" y="261.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">program</text>
</g>
<g class="node" data-id="fs2" data-label="file server" data-shape="rectangle">
  <rect x="599.862" y="243.35000000000002" width="101.971" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="650.8475" y="261.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">file server</text>
</g>
<g class="node" data-id="net2" data-label="network server" data-shape="rectangle">
  <rect x="487.524" y="300.25" width="133.09300000000002" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="554.0705" y="318.7" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">network server</text>
</g>
<g class="node" data-id="drv2" data-label="network driver with a bug: only this box in reach" data-shape="rectangle">
  <rect x="487.524" y="358.70000000000005" width="315.37899999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="#c00" stroke-width="3px" />
  <text x="645.2135" y="377.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">network driver with a bug: only this box in reach</text>
</g>
<g class="node" data-id="mk2" data-label="microkernel: spaces, threads, IPC" data-shape="rectangle">
  <rect x="487.524" y="128" width="239.79699999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="607.4225" y="146.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">microkernel: spaces, threads, IPC</text>
