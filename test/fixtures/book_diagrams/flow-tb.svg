<g class="node" data-id="sys" data-label="system domain: root task, domain service, facets, console" data-shape="rectangle">
  <rect x="248.347125" y="253.8" width="371.6949999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
