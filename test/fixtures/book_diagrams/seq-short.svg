<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 698.8969999999999 395" width="698.8969999999999" height="395" style="--bg:#FFFFFF;--fg:#27272A">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM%20Plex%20Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'IBM Plex Mono', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="T" x1="90.3235" y1="70" x2="90.3235" y2="365" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="S" x1="260.6035" y1="70" x2="260.6035" y2="365" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="W" x1="428.6605" y1="70" x2="428.6605" y2="365" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="W2" x1="597.829" y1="70" x2="597.829" y2="365" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="W" data-to="W" data-label="meets an unexpected case" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="428.6605,90 458.6605,90 458.6605,110 428.6605,110" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="466.6605" y="100" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">meets an unexpected case</text>
</g>
<g class="message" data-from="W" data-to="S" data-label="exit signal, reason {badmatch, ...}" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="428.6605" y1="160" x2="260.6035" y2="160" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="344.632" y="150" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">exit signal, reason {badmatch, ...}</text>
</g>
<g class="message" data-from="S" data-to="S" data-label="one_for_one; within restart limit" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="260.6035,200 290.6035,200 290.6035,220 260.6035,220" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="298.6035" y="210" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">one_for_one; within restart limit</text>
</g>
<g class="message" data-from="S" data-to="W2" data-label="start from the child specification" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="260.6035" y1="270" x2="597.829" y2="270" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="429.21624999999995" y="260" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">start from the child specification</text>
</g>
<g class="message" data-from="W2" data-to="S" data-label="started, registers its name" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="597.829" y1="310" x2="260.6035" y2="310" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="429.21624999999995" y="300" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">started, registers its name</text>
</g>
<g class="note" data-position="over" data-actors="T">
  <polygon points="47.5015,318 127.1455,318 133.1455,324 133.1455,341 47.5015,341" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="127.1455,318 133.1455,324 127.1455,324" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="90.3235" y="329.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">sees nothing</text>
</g>
<g class="actor" data-id="T" data-label="top supervisor" data-type="participant">
  <rect x="29.999999999999993" y="30" width="120.647" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="90.3235" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">top supervisor</text>
</g>
<g class="actor" data-id="S" data-label="driver supervisor" data-type="participant">
  <rect x="190.647" y="30" width="139.913" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="260.6035" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">driver supervisor</text>
</g>
<g class="actor" data-id="W" data-label="driver worker" data-type="participant">
  <rect x="370.56" y="30" width="116.20100000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="428.6605" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">driver worker</text>
</g>
<g class="actor" data-id="W2" data-label="new driver worker" data-type="participant">
  <rect x="526.761" y="30" width="142.136" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="597.829" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">new driver worker</text>
</g>
</svg>